[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h3_optimizer"
version = "0.2.0a1"
description = "Thermodynamically efficient optimizer with Lipschitz-adaptive learning rates and information-weighted sampling"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    {name = "Nuno Cardoso", email = "nuno@example.com"}
]
keywords = [
    "optimization",
    "thermodynamics",
    "energy-efficient",
    "machine-learning",
    "deep-learning",
    "green-ai",
    "pytorch",
    "h3",
    "lipschitz-adaptive",
    "information-weighted-sampling"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "torch>=1.9.0",
    "numpy>=1.19.0",
    "torchvision>=0.10.0",
    "pandas>=1.3.0",
    "matplotlib>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12",
    "black>=21.0",
    "flake8>=3.9",
    "mypy>=0.910",
]
gpu = [
    "pynvml>=11.0.0",
]
notebooks = [
    "jupyter>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/nfocardoso/EMSTI"
"Bug Reports" = "https://github.com/nfocardoso/EMSTI/issues"
"Source" = "https://github.com/nfocardoso/EMSTI"
"Documentation" = "https://github.com/nfocardoso/EMSTI/blob/main/README.md"

[project.scripts]
h3-report = "h3.cli:main"

[tool.setuptools]
packages = ["h3", "benchmarks", "examples", "tests"]
